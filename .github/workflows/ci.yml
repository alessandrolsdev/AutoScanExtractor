# Nome do seu fluxo de trabalho (aparecerá no GitHub)
name: Testes Automatizados (CI com Pytest)

# Gatilhos: Quando este fluxo de trabalho deve rodar
on:
  # Roda toda vez que você der 'push' para o branch 'main'
  push:
    branches: [ "main" ]
  # Roda também se alguém abrir um 'Pull Request' para o 'main'
  pull_request:
    branches: [ "main" ]

# Trabalhos (Jobs): O que o robô deve fazer
jobs:
  # Definimos um único trabalho (job) chamado "build-and-test"
  build-and-test:
    
    # Sistema Operacional: Usamos o Ubuntu (Linux) porque é rápido
    # e fácil de instalar o Tesseract
    runs-on: ubuntu-latest

    # Passos (Steps): A receita que o robô vai seguir
    steps:
    # Passo 1: Baixar seu código do GitHub para a máquina virtual
    - name: 1. Fazer Checkout do código
      uses: actions/checkout@v4

    # Passo 2: Configurar o Python na máquina
    - name: 2. Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" # Usamos uma versão moderna do Python

    # Passo 3: Instalar as dependências do Sistema (O TESSERACT)
    - name: 3. Instalar Tesseract OCR (e idioma Português)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-por

    # Passo 4: Instalar as dependências do Python (do seu requirements.txt)
    - name: 4. Instalar dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # O pytest será instalado por esta linha

    # Passo 5: Rodar os testes!
    - name: 5. Executar os testes (pytest)
      run: |
        pytest