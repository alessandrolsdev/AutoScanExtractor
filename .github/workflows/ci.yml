# Testes automatizados.
#
# Roda em todos os branches e pull requests: antes o gatilho estava preso ao
# `main`, então o trabalho feito em branch só era verificado depois do merge —
# exatamente quando o defeito já custa caro.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ruff
        run: pip install ruff

      # F821 (nome indefinido) é a regra que teria pego, sem executar nada, o
      # `dataclasses.asdict` sem import que quebrava todo PDF digital.
      - name: Rodar ruff
        run: ruff check .

  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar Tesseract OCR (com português)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar a suíte de testes
        run: pytest
